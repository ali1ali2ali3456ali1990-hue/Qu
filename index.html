<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محرر أسئلة الاختبارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<style id="pgs"></style>
<style>
:root{--bg:#e7ecef;--ink:#12303a;--bar:#fff;--line:#c4ced4;--acc:#14705f;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171b;--ink:#dbe7ec;--bar:#1a252b;--line:#33444c;--acc:#3fb59c;--onacc:#07211b}}
:root[data-theme="dark"]{--bg:#10171b;--ink:#dbe7ec;--bar:#1a252b;--line:#33444c;--acc:#3fb59c;--onacc:#07211b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
.home{max-width:780px;margin:0 auto;padding:44px 20px}
.home h1{font-size:34px;font-weight:800;margin:0 0 6px}
.home p{margin:0 0 28px;opacity:.75}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.big{background:var(--acc);color:var(--onacc);border:0;border-radius:18px 4px 18px 4px;padding:34px 22px;text-align:right;cursor:pointer;font-size:24px;font-weight:800;min-height:140px}
.big small{display:block;font-weight:400;font-size:15px;margin-top:8px;opacity:.9}
.big.alt{background:var(--bar);color:var(--ink);border:2px solid var(--acc);border-radius:4px 18px 4px 18px}
.back{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:8px 0;font-size:16px}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px}
.tools button,.tools select,.tools input{min-height:40px;min-width:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;padding:0 10px}
.tools input{width:56px;padding:0 4px;text-align:center}
.tools label{font-size:13px;display:flex;align-items:center;gap:4px}
.tools .pr{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.tools .sp{flex:1}
.tools label.btn{min-height:40px;min-width:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;font-size:inherit}
.tools input[type=checkbox]{width:22px;min-width:0;min-height:22px;padding:0}
.tools input[type=color]{width:46px;padding:2px}
.grp{display:inline-flex;gap:6px;align-items:center}
.tools{display:block;padding:0}
.tabs,.panel{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;align-items:center;padding:6px 10px;scrollbar-width:thin}
.tabs{border-bottom:1px solid var(--line);padding-bottom:0}
.tools *{flex-shrink:0;white-space:nowrap}
.tools .tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-weight:600}
.tools .tab.on{border-bottom-color:var(--acc);color:var(--acc)}
.hint{font-size:13px;opacity:.7}
.obj{resize:none}.obj.sel{resize:both}
.obj.in{position:static;display:inline-block;vertical-align:middle;margin:0 4px}.obj.blk{position:static;display:block;margin:6px auto}
.ed>div:not(.obj){margin-right:calc((var(--pr,0) + var(--hi,0))*1mm);margin-left:calc(var(--pl,0)*1mm);text-indent:calc(var(--hi,0)*-1mm)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#msg{background:var(--acc);color:var(--onacc);text-align:center;padding:6px 10px;font-size:14px}
.ruler{height:44px;position:sticky;z-index:7;margin:8px 0 0 auto;box-sizing:border-box;background:var(--bar);border:1px solid var(--line);background-image:repeating-linear-gradient(to left,var(--ink) 0 1px,transparent 1px 10mm),repeating-linear-gradient(to left,var(--line) 0 1px,transparent 1px 5mm);background-size:100% 10px,100% 6px;background-position:bottom,bottom;background-repeat:no-repeat}
.rh{position:absolute;top:0;width:28px;height:17px;cursor:ew-resize;touch-action:none}
.rh::after{content:'';position:absolute;left:8px;top:2px;border:6px solid transparent;border-top:12px solid var(--acc)}
.rh.f::after{border-top:0;border-bottom:12px solid #c2410c;top:3px}
.rh.r{right:calc(var(--r,0)*1mm - 14px)}.rh.l{left:calc(var(--l,0)*1mm - 14px)}.rh.f{top:27px;right:calc(var(--a,0)*1mm - 14px)}
.tb{text-indent:0}
.rn{position:absolute;top:15px;font-size:10px;font-weight:600;line-height:12px;opacity:.75;transform:translateX(50%);pointer-events:none}
.vr{position:absolute;left:0;top:64px;width:30px;box-sizing:border-box;background-color:var(--bar);border:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 10mm),repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 5mm);background-size:12px 100%,7px 100%;background-position:right,right;background-repeat:no-repeat}
.vn{position:absolute;left:3px;font-size:10px;font-weight:600;line-height:10px;opacity:.75;transform:translateY(-50%);pointer-events:none}
.vg{position:absolute;left:0;width:30px;height:28px;cursor:ns-resize;touch-action:none}
.vg::after{content:'';position:absolute;right:0;top:8px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:12px solid var(--acc)}
.mp{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(297mm - 3px),#9ca3af calc(297mm - 3px),#9ca3af 297mm)}
.gd{position:absolute;pointer-events:none;z-index:9;border:0 dotted var(--acc)}
.tools button:disabled{opacity:.35}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;margin:4px 0;text-indent:0}
.tbl td{border:1px solid #000;padding:4px 6px;vertical-align:top;word-break:break-word;min-width:10px}
.tbl td.th{font-weight:700;background-color:#e5e7eb}
.tbl.band tr:nth-child(even) td{background-color:#f1f3f5}
.tbl td.csel{outline:2px solid #14705f;outline-offset:-2px;background-image:linear-gradient(#14705f33,#14705f33)}
dialog input[type=number]{width:70px;min-height:40px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 6px;font:inherit}
dialog label{display:inline-flex;align-items:center;gap:6px}
.thdl i{position:absolute;width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;touch-action:none;z-index:6;cursor:move}
.thdl i.tz{cursor:nesw-resize}
.vg.t{top:calc(var(--t,0)*1mm - 14px)}.vg.b{top:calc((var(--hh,297) - var(--b,0))*1mm - 14px)}
.bar .x{position:absolute;left:0;top:0;width:28px;height:16px;cursor:pointer;background:#b91c1c}
#warn{background:#b45309;color:#fff;text-align:center;padding:5px;font-size:14px}
.wrap{padding:6px 0 40px;overflow:visible}
#sheet{width:max-content;margin:0 auto;position:relative;display:flow-root;padding-left:34px}
.page{background:#fff;color:#000;width:210mm;height:297mm;margin:12px auto;box-shadow:0 2px 14px #0005;display:flex;flex-direction:column;overflow:hidden;position:relative;box-sizing:border-box}
.land{width:297mm;height:210mm;flex-direction:row}
.half{flex:1;position:relative;overflow:hidden;min-width:0}
.half:first-child{border-left:1.5px dashed #888}
.ed{flex:1;min-height:0;height:100%;overflow:hidden;outline:none;position:relative;isolation:isolate;font-size:16px;line-height:1.5;box-sizing:border-box;font-family:Cairo,Tahoma,sans-serif;word-wrap:break-word}
.mir{pointer-events:none}
.ed div{min-height:1em}
.hd{display:flex;border-bottom:3px solid #000}
.bx{border:2.5px solid #000;font-weight:800;padding:6px 8px;text-align:center;flex:1;outline:none;min-height:3.2em}
.bx.mid{flex:1.8;font-size:1.25em}
.sep{display:flex;align-items:center;gap:8px;padding:4px 10px}
.sep i{flex:1;border-top:2px dotted #000}
.ft{margin:0 6px 6px;font-weight:600;min-height:2em;flex:none}
.mth{direction:ltr;unicode-bidi:isolate;display:inline}
.mth math{font-size:1em}
.mth mfrac>*{padding:.12em .14em}
.obj{position:absolute;box-sizing:border-box;resize:both;overflow:auto;border:1px dashed transparent;min-width:40px;min-height:30px}
.obj.front{z-index:3}.obj.behind{z-index:-1}
.obj.fr,.obj.fl{position:static}
.obj.fr{float:right;margin:2px 0 6px 10px}.obj.fl{float:left;margin:2px 10px 6px 0}
.obj.sel{border-color:#14705f;z-index:5}
.obj img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.tb{min-height:100%;outline:none;padding:4px;border:1px solid #000;box-sizing:border-box}
.bar{position:absolute;top:0;left:0;right:0;height:16px;line-height:16px;background:#14705f;color:#fff;font-size:11px;text-align:center;cursor:move;touch-action:none;display:none;z-index:2}
.sel .bar{display:block}
dialog{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(640px,96vw);max-height:92vh;overflow:auto}
dialog textarea{width:100%;box-sizing:border-box;height:70px;direction:ltr;font-family:monospace;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
#pv{min-height:56px;direction:ltr;text-align:center;font-size:22px;padding:8px;border:1px dashed var(--line);margin:8px 0;border-radius:8px}
#sn{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;max-height:34vh;overflow:auto}
#sn button math{font-size:1.2em}
#sc{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px}
#sc button{white-space:nowrap;min-height:38px;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:18px;padding:0 12px;cursor:pointer;font:inherit;flex-shrink:0}
#sc button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#sn button,.dl button{min-height:40px;min-width:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.dl{display:flex;gap:8px;justify-content:flex-start}.dl .ok{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
@media print{
 body{background:#fff}body::before{display:none}
 .tools,#warn,#msg,#home,#sub,.ruler,.vr,.thdl,.gd{display:none!important}
 .wrap{padding:0;overflow:visible}#sheet{zoom:1!important;width:auto;padding:0}
 .page{margin:0;box-shadow:none;break-after:page;background-image:none!important}
 .bar{display:none!important}.obj,.obj.sel{border-color:transparent!important;resize:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>

<section id="home" class="home">
 <h1>محرر أسئلة الاختبارات</h1>
 <p>اكتب الأسئلة على ورقة A4 جاهزة للطباعة، مع الصور والمعادلات.</p>
 <div class="opts">
  <button class="big" id="bMonthly">اختبار شهري<small>نسخة واحدة أو نسختان في ورقة</small></button>
  <button class="big alt" id="bFinal">نصف سنة / نهاية سنة<small>ورقة بترويسة ثابتة وتذييل</small></button>
 </div>
</section>

<section id="sub" class="home" hidden>
 <button class="back" data-go="home">رجوع</button>
 <h1>اختبار شهري</h1><p>اختر شكل الورقة.</p>
 <div class="opts">
  <button class="big" id="bM1">نسخة في ورقة واحدة<small>ورقة A4 عمودية</small></button>
  <button class="big alt" id="bM2">نسختان في ورقة واحدة<small>ورقة A4 أفقية، تنسخ النص تلقائيًا</small></button>
 </div>
</section>

<section id="app" hidden>
 <div class="tools" id="tools">
  <div class="tabs">
   <button data-back>رجوع</button><button id="bUndo" title="تراجع">↶</button><button id="bRedo" title="إعادة">↷</button>
   <button class="tab on" data-t="home">الرئيسية</button><button class="tab" data-t="ins">إدراج</button><button class="tab" data-t="tbl">جدول</button><button class="tab" data-t="lay">تخطيط</button><button class="tab" data-t="obj">عنصر</button>
   <span class="sp"></span>
   <button class="pr" id="bPrint">طباعة / PDF</button>
  </div>
  <div class="panel" data-p="home">
   <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button>
   <button data-c="justifyRight" title="يمين">⇥</button><button data-c="justifyCenter" title="وسط">≡</button><button data-c="justifyLeft" title="يسار">⇤</button><button data-c="justifyFull" title="ضبط">☰</button>
   <select id="ff" title="الخط"><option>Cairo</option><option>Tajawal</option><option>Amiri</option><option>Noto Naskh Arabic</option><option>Reem Kufi</option><option>Tahoma</option><option>Arial</option><option>Times New Roman</option></select>
   <select id="fs" title="حجم الخط"></select>
  </div>
  <div class="panel" data-p="ins" hidden>
   <label class="btn" for="file">صورة</label><button id="bEq">معادلة</button><button id="bTb">مربع نص</button><button id="bTbl">جدول</button><button id="bPaste">لصق صورة</button><span class="hint">إذا لم يفتح معرض الصور: انسخ الصورة ثم اضغط «لصق صورة»</span>
  </div>
  <div class="panel" data-p="tbl" hidden>
   <button data-tb="rowU">صف فوق</button><button data-tb="rowD">صف تحت</button><button data-tb="colR">عمود يمين</button><button data-tb="colL">عمود يسار</button>
   <button data-tb="delRow">حذف صف</button><button data-tb="delCol">حذف عمود</button><button data-tb="delTbl">حذف الجدول</button>
   <button data-tb="merge">دمج الخلايا</button><button data-tb="split">تقسيم الخلية</button>
   <button data-tb="selRow">تحديد الصف</button><button data-tb="selCol">تحديد العمود</button><button data-tb="selAll">تحديد الجدول</button>
   <label>ارتفاع الصف مم<input id="tcRH" type="number" min="3" max="200"></label>
   <label>عرض العمود مم<input id="tcCW" type="number" min="5" max="300"></label>
   <button data-tb="even">توزيع الأعمدة</button>
   <select id="tcFit"><option value="page">عرض الصفحة</option><option value="content">حسب المحتوى</option></select>
   <select id="tcAl"><option value="r">الجدول يمين</option><option value="c">الجدول وسط</option><option value="l">الجدول يسار</option></select>
   <select id="tcPos"><option value="flow">ضمن النص</option><option value="fr">التفاف يمين</option><option value="fl">التفاف يسار</option><option value="free">حر فوق النص</option></select><label>عرض الجدول مم<input id="tcTW" type="number" min="20" max="300"></label><select id="tcVA"><option value="top">محاذاة أعلى</option><option value="middle">محاذاة وسط</option><option value="bottom">محاذاة أسفل</option></select>
   <label>تظليل<input type="color" id="tcShade" value="#e5e7eb"></label><button data-tb="noShade">بدون تظليل</button>
   <select id="tcBr"><option value="" selected disabled hidden>الحدود</option><option value="all">كل الحدود</option><option value="none">بدون حدود</option><option value="out">حدود خارجية</option><option value="top">أعلى</option><option value="bottom">أسفل</option><option value="right">يمين</option><option value="left">يسار</option></select>
   <label>سمك<select id="tcBw"><option>1</option><option>2</option><option>3</option></select></label><label>لون<input type="color" id="tcBc" value="#000000"></label>
   <label>تباعد الخلايا<select id="tcPad"><option>2</option><option selected>4</option><option>6</option><option>8</option><option>12</option></select></label>
   <label><input type="checkbox" id="tcHd"> صف عنوان</label><label><input type="checkbox" id="tcBd"> صفوف متبادلة</label>
  </div>
  <div class="panel" data-p="lay" hidden>
   <label>تباعد الأسطر<select id="lh"><option>1</option><option>1.2</option><option selected>1.5</option><option>2</option></select></label>
   <label>هامش يمين<input id="mR" type="number" min="0" max="60" value="0"></label>
   <label>هامش يسار<input id="mL" type="number" min="0" max="60" value="0"></label><label>هامش علوي<input id="mT" type="number" min="0" max="120" value="0"></label><label>هامش سفلي<input id="mB" type="number" min="0" max="120" value="0"></label>
   <span class="hint">يمكنك أيضًا سحب المؤشرات على المسطرة</span>
  </div>
  <div class="panel" data-p="obj" hidden>
   <span id="objHint" class="hint">اضغط على صورة أو مربع نص لتظهر خياراته هنا</span>
   <button id="bNext" title="تحديد العنصر التالي">تحديد عنصر</button>
   <select id="wrap" hidden><option value="front">أمام النص</option><option value="behind">خلف النص</option><option value="fr">التفاف يمين</option><option value="fl">التفاف يسار</option><option value="in">داخل السطر</option><option value="blk">أعلى وأسفل النص</option></select>
   <span id="szo" class="grp" hidden><label>عرض مم<input id="oW" type="number" min="5" max="300"></label><label>ارتفاع مم<input id="oH" type="number" min="5" max="300"></label><label><input type="checkbox" id="oLk" checked> ثبّت النسبة</label></span><span id="tbo" class="grp" hidden><label><input type="checkbox" id="tbB" checked> إطار</label><label><input type="checkbox" id="tbF"> خلفية</label><input type="color" id="tbC" value="#fff3b0" title="لون الخلفية"></span>
   <button id="del" hidden>حذف العنصر</button>
  </div>
 </div>
 <div id="msg" hidden></div>
 <div id="warn" hidden>النص تجاوز حدود الورقة. صغّر الخط أو قلّل النص.</div>
 <div class="wrap"><div id="sheet"></div></div>
 <input type="file" id="file" class="vh" accept="image/*">
</section>

<dialog id="tbd"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><label>الصفوف <input id="tRows" type="number" min="1" max="30" value="3"></label><label>الأعمدة <input id="tCols" type="number" min="1" max="12" value="3"></label><label><input type="checkbox" id="tHdr" checked> صف عنوان</label></div><div class="dl" style="margin-top:14px"><button class="ok" id="tbOk">إدراج</button><button id="tbNo">إلغاء</button></div></dialog>
<dialog id="pm"><div class="dl" style="flex-direction:column"><button class="ok" id="pPdf">حفظ كملف PDF</button><button id="pHtml">طباعة (حفظ ملف يفتح شاشة الطباعة)</button><button id="pNo">إلغاء</button></div></dialog>
<dialog id="eq">
 <textarea id="ta" placeholder="اكتب المعادلة بصيغة LaTeX مثل \frac{x+1}{2} أو اختر من الرموز بالأسفل"></textarea>
 <div id="pv"></div>
 <div class="dl"><button class="ok" id="eqOk">إدراج</button><button id="eqNo">إلغاء</button></div>
 <div id="sc"></div>
 <div id="sn"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let M,ed,mr,saved,cur,eqT,eqR,zm=1,IND=null;
const FONTS='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap';
const RUL=m=>{const w=m==='m2'?148.5:210;let n='';for(let i=1;i<=Math.floor(w/10);i++)n+='<b class="rn" style="right:'+i*10+'mm">'+i+'</b>';
 return '<div class="ruler" id="rl" style="width:'+w+'mm">'+n+'<i class="rh r" data-k="r"></i><i class="rh f" data-k="f"></i><i class="rh l" data-k="l"></i></div>'};

 return '<div class="vr" id="vr" style="height:'+h+'mm;--hh:'+h+'">'+n+'<i class="vg t" data-k="t"></i><i class="vg b" data-k="b"></i></div>'};

    if(t.offsetWidth<cw-4){t.style.marginRight=Math.max(0,Math.min(cw-t.offsetWidth,mr0-dx))+'px';t.style.marginLeft='auto'}
   }
  }
  placeTH();after()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
  if(t.parentNode===ed&&!t.nextElementSibling){const d=document.createElement('div');d.innerHTML='<br>';t.after(d)}placeTH()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
};

addEventListener('resize',placeTH);
/* تراجع وإعادة */
let hist=[],hp=-1,hT=null,hLock=false;
function ser(){
 const c=ed.cloneNode(true);
 [...c.children].forEach(k=>{if(k.style)k.style.marginTop=''});
 c.querySelectorAll('.csel').forEach(x=>x.classList.remove('csel'));
 c.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
 return c.innerHTML;
}
function updUR(){const u=$('#bUndo'),r=$('#bRedo');if(u)u.disabled=!(hp>0);if(r)r.disabled=!(hp<hist.length-1)}
function snapNow(){if(hLock||!ed)return;const h=ser();if(hist[hp]===h)return;hist=hist.slice(0,hp+1);hist.push(h);if(hist.length>100)hist.shift();hp=hist.length-1;updUR()}
function snap(){clearTimeout(hT);hT=setTimeout(snapNow,400)}
function loadH(h){
 hLock=true;ed.innerHTML=h;pick(null);clearSel();after();
 ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
 hLock=false;updUR();
}
function undo(){clearTimeout(hT);snapNow();if(hp>0){hp--;loadH(hist[hp])}}
function redo(){clearTimeout(hT);if(hp<hist.length-1){hp++;loadH(hist[hp])}}
function urKey(e){const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='y')){e.preventDefault();(k==='y'||e.shiftKey)?redo():undo()}}
function urIn(e){if(e.inputType==='historyUndo'){e.preventDefault();undo()}else if(e.inputType==='historyRedo'){e.preventDefault();redo()}}
$('#bUndo').onmousedown=$('#bRedo').onmousedown=e=>e.preventDefault();
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
/* مسطرة ثابتة وخطوط إرشاد */
function fixRuler(){const rl=$('#rl'),t=$('#tools');if(!rl||!t)return;const top=parseFloat(getComputedStyle(t).top)||0;rl.style.top=((top+t.offsetHeight)/(zm||1))+'px'}
new ResizeObserver(fixRuler).observe($('#tools'));
const GD=document.createElement('div');GD.className='gd';GD.hidden=true;
function guideV(k){
 const rl=$('#rl'),pg=$('#sheet .page');if(!rl||!pg)return;
 const v=+rl.style.getPropertyValue(k==='r'?'--r':k==='l'?'--l':'--a')||0;
 const x=k==='l'?rl.offsetLeft+v*MM:rl.offsetLeft+rl.offsetWidth-v*MM;
 Object.assign(GD.style,{left:x+'px',top:pg.offsetTop+'px',width:'0',height:pg.offsetHeight+'px',borderLeftWidth:'2px',borderTopWidth:'0'});GD.hidden=false;
}
function guideH(k){
 const pg=$('#sheet .page');if(!pg)return;
 const t=+$('#mT').value||0,b=+$('#mB').value||0,y=pg.offsetTop+(k==='t'?t*MM:297*MM-b*MM);
 Object.assign(GD.style,{left:pg.offsetLeft+'px',top:y+'px',width:pg.offsetWidth+'px',height:'0',borderTopWidth:'2px',borderLeftWidth:'0'});GD.hidden=false;
}
addEventListener('pointerup',()=>{GD.hidden=true});
function caretAt(x,y){
 if(document.caretRangeFromPoint)return document.caretRangeFromPoint(x,y);
 const p=document.caretPositionFromPoint&&document.caretPositionFromPoint(x,y);if(!p)return null;
 const r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r;
}
/* صفحات متعددة */
let PGN=1;
function paginate(){
 const pg=ed&&ed.closest('.page');if(!pg||M==='m2')return;
 const mp=96/25.4,pageH=297*mp,mT=(+$('#mT').value||0)*mp,mB=(+$('#mB').value||0)*mp;
 const off=ed.offsetTop,fH=Math.max(0,pg.offsetHeight-ed.offsetTop-ed.offsetHeight);
 const bl=[...ed.children].filter(x=>!x.classList.contains('obj'));
 let N=PGN;
 for(let it=0;it<4;it++){
  pg.style.height=N*297+'mm';
  let cb=0;
  for(const b of bl){
   b.style.marginTop='';
   const m0=parseFloat(getComputedStyle(b).marginTop)||0;
   const P=off+b.offsetTop,h=b.offsetHeight,k=Math.max(0,Math.floor((P+.5)/pageH));
   const cap=(k+1)*pageH-mB-(k>=N-1?fH:0);
   if(P+h>cap+.5&&P>k*pageH+(k?mT:0)+2&&h<pageH-mT-mB)b.style.marginTop=(m0+(k+1)*pageH+mT-P)+'px';
   cb=Math.max(cb,off+b.offsetTop+b.offsetHeight);
  }
  const need=Math.max(1,Math.ceil((cb+mB+fH-.5)/pageH));
  if(need===N)break;N=need;
 }
 PGN=N;pg.style.height=N*297+'mm';
}
async function mathImg(el){
 const mm=el.querySelector('math')||el,r=mm.getBoundingClientRect();
 const pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
 el.after(pr);const bl=pr.getBoundingClientRect().bottom;pr.remove();
 const w=Math.ceil(r.width)+2,h=Math.ceil(r.height)+2,k=3,d=Math.round((r.bottom-bl+(h-r.height))*10)/10;
 const x=new XMLSerializer().serializeToString(el.cloneNode(true));
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;line-height:0;color:#000;font-size:'+getComputedStyle(el).fontSize+';direction:ltr"><style>math{font-size:1em}mfrac>*{padding:.12em .14em}</style>'+x+'</div></foreignObject></svg>';
 const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await im.decode();
 const c=document.createElement('canvas');c.width=w*k;c.height=h*k;const g=c.getContext('2d');g.scale(k,k);g.drawImage(im,0,0);
 return{url:c.toDataURL('image/png'),w:w,h:h,d:d};
}
function isBlank(cv){
 const c=document.createElement('canvas');c.width=200;c.height=280;const g=c.getContext('2d');g.drawImage(cv,0,0,200,280);
 const d=g.getImageData(0,0,200,280).data;for(let i=0;i<d.length;i+=4){if(d[i]<250||d[i+1]<250||d[i+2]<250)return false}return true;
}
async function svgShot(node,W,H){
 const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
 const xml=new XMLSerializer().serializeToString(node);
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" lang="ar"><style><![CDATA['+css+']]></style>'+xml+'</div></foreignObject></svg>';
 const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await im.decode();
 const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.scale(2,2);g.drawImage(im,0,0);return c;
}
async function savePdf(){
 pick(null);clearSel();
 let dl=null;try{dl=await claude.use('downloads')}catch(x){}
 if(!dl){msg('الحفظ غير متاح في هذا العرض.');return}
 if(!window.html2canvas||!window.jspdf){msg('تعذر تحميل مكتبة PDF. تأكد من الاتصال بالإنترنت.');return}
 msg('جارٍ تجهيز ملف PDF…');
 const land=M==='m2',W=land?1123:794,sh=$('#sheet'),z=sh.style.zoom,pg0=sh.querySelector('.page'),H=Math.round(pg0.offsetHeight),np=land?1:Math.max(1,Math.round(pg0.offsetHeight/(297*96/25.4)));
 let host=null;
 try{
  await document.fonts.ready;
  const pg=sh.querySelector('.page'),imgs=[];
  sh.style.zoom=1;
  for(const m of pg.querySelectorAll('.mth')){try{imgs.push(await mathImg(m))}catch(x){imgs.push(null)}}
  sh.style.zoom=z;
  const cl=pg.cloneNode(true);
  cl.querySelectorAll('.bar,.thdl').forEach(x=>x.remove());
  cl.querySelectorAll('.csel').forEach(x=>x.classList.remove('csel'));
  cl.querySelectorAll('.obj').forEach(x=>{x.classList.remove('sel');x.style.borderColor='transparent';x.style.resize='none'});
  cl.querySelectorAll('.mth').forEach((m,i)=>{
   const o=imgs[i];
   if(o){const im=document.createElement('img');im.src=o.url;im.style.cssText='width:'+o.w+'px;height:'+o.h+'px;vertical-align:'+(-o.d)+'px;display:inline-block';m.replaceWith(im)}
   else{const t=document.createElement('span');t.textContent=m.dataset.tex||'';m.replaceWith(t)}
  });
  cl.style.margin='0';cl.style.boxShadow='none';cl.style.backgroundImage='none';
  host=document.createElement('div');
  host.style.cssText='position:absolute;left:0;top:0;width:'+W+'px;height:'+H+'px;z-index:-1;background:#fff';
  host.appendChild(cl);document.body.appendChild(host);
  await new Promise(r=>setTimeout(r,200));
  let cv=null;
  try{cv=await html2canvas(cl,{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:Math.max(innerWidth,W),windowHeight:Math.max(innerHeight,H)})}catch(x){cv=null}
  if(!cv||isBlank(cv))cv=await svgShot(cl,W,H);
  const pdf=new jspdf.jsPDF({orientation:land?'l':'p',unit:'mm',format:'a4'});
  const ph=Math.floor(cv.height/np);
  for(let i=0;i<np;i++){
   const c2=document.createElement('canvas');c2.width=cv.width;c2.height=ph;
   c2.getContext('2d').drawImage(cv,0,i*ph,cv.width,ph,0,0,cv.width,ph);
   if(i)pdf.addPage();
   pdf.addImage(c2.toDataURL('image/jpeg',.95),'JPEG',0,0,land?297:210,land?210:297);
  }
  await dl.save({filename:'exam-paper.pdf',data:pdf.output('blob')});
  msg('تم تجهيز ملف PDF.');
 }catch(x){if(!x||x.code!=='declined')msg('تعذر إنشاء PDF. جرّب خيار «طباعة» بدلًا منه.')}
 finally{sh.style.zoom=z;if(host)host.remove()}
}
